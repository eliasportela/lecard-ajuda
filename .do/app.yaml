name: lecard-ajuda
region: nyc
services:
  - name: web
    environment_slug: node-js
    github:
      repo: eliasportela/lecard-ajuda
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm run start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8080"
      - key: NUXT_DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: NUXT_SPACES_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NUXT_SPACES_SECRET
        scope: RUN_TIME
        type: SECRET
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    environment_slug: node-js
    github:
      repo: eliasportela/lecard-ajuda
      branch: main
    build_command: npm install
    run_command: npm run db:migrate
    envs:
      - key: NUXT_DATABASE_URL
        scope: RUN_TIME
        type: SECRET
